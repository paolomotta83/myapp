<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I miei artefatti</title>
<style>
:root{--bg:#f6f7f4;--panel:#fff;--ink:#1d2421;--mute:#68716c;--line:#dde1dc;--acc:#1f6f5c;--acc2:#e8f1ee}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--panel:#1c211f;--ink:#e8ece9;--mute:#98a29c;--line:#2d3532;--acc:#5cc2a5;--acc2:#203029}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}
#menu{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .25s;padding-top:env(safe-area-inset-top,0)}
body.closed #menu{margin-left:-290px}
#menu h1{font-size:1.05rem;margin:0;padding:16px 16px 10px}
#menu small{display:block;padding:0 16px 10px;color:var(--mute)}
#list{flex:1;overflow-y:auto;padding:4px 8px 16px}
#list button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:11px 10px;border-radius:8px;cursor:pointer}
#list button:hover{background:var(--acc2)}
#list button[aria-current=true]{background:var(--acc2);color:var(--acc);font-weight:600}
#list button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#list .ic{width:1.4em;text-align:center}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#bar{display:flex;align-items:center;gap:10px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0));border-bottom:1px solid var(--line);background:var(--panel)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line)}
.btn:hover{background:var(--acc2)}
#title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:24px}
#foot{display:flex;justify-content:flex-end;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--panel)}
#info{position:absolute;left:0;right:0;bottom:0;max-height:70%;overflow-y:auto;background:var(--panel);border-top:2px solid var(--acc);box-shadow:0 -8px 24px rgba(0,0,0,.18);padding:16px 18px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0));transform:translateY(105%);transition:transform .25s;z-index:5}
#info.open{transform:none}
#info h2{margin:0 0 8px;font-size:1.05rem}
#info h3{margin:14px 0 4px;font-size:.9rem;color:var(--mute);font-weight:600}
#info p,#info ul{margin:0}
#info ul{padding-left:1.2em}
#info .mod{font-variant-numeric:tabular-nums}
@media (max-width:700px){
 #menu{position:fixed;z-index:10;inset:0 auto 0 0;width:min(86vw,320px);box-shadow:4px 0 24px rgba(0,0,0,.25)}
 body.closed #menu{margin-left:calc(-1 * min(86vw,320px) - 30px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav id="menu" aria-label="Elenco artefatti">
  <h1>I miei artefatti</h1>
  <small id="count">Caricamento…</small>
  <div id="list"></div>
</nav>

<div id="main">
  <div id="bar">
    <button class="btn" id="toggle" aria-label="Apri o chiudi il menu" title="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <div id="title">Scegli un artefatto</div>
  </div>
  <div id="stage">
    <div id="empty">Apri il menu e scegli un artefatto.</div>
    <iframe id="frame" title="Artefatto" hidden></iframe>
    <section id="info" aria-live="polite" aria-label="Informazioni sull'artefatto"></section>
  </div>
  <div id="foot">
    <button class="btn" id="infoBtn" aria-label="Informazioni sull'artefatto" aria-expanded="false" title="Informazioni" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<script>
// Cartelle note: usate se l'API di GitHub non risponde (es. prova in locale).
const FALLBACK = ["agenda", "qrcode", "scheda-palestra", "turni", "turni-schede", "turnipro", "appartamento-3d"];
const SKIP = /^(\.|_|assets$|node_modules$|docs$)/;

const $ = id => document.getElementById(id);
let items = [], current = null;

function parseNote(html){
  const m = html.match(/<!--\s*ARTEFATTO\b([\s\S]*?)-->/i);
  const out = {};
  if(!m) return out;
  let key = null;
  m[1].split(/\r?\n/).forEach(line=>{
    const k = line.match(/^\s*([A-Za-zÀ-ÿ ]{2,20}):\s*(.*)$/);
    if(k){ key = k[1].trim().toLowerCase(); out[key] = k[2]; }
    else if(key && line.trim()){ out[key] += "\n" + line.trim(); }
  });
  return out;
}
function nice(slug){ return slug.replace(/[-_]+/g," ").replace(/^./,c=>c.toUpperCase()); }

async function folders(){
  const host = location.hostname, seg = location.pathname.split("/").filter(Boolean);
  if(host.endsWith(".github.io")){
    const owner = host.split(".")[0];
    const repo = seg.length && !seg[0].includes(".") ? seg[0] : host;
    try{
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
      if(r.ok){
        const j = await r.json();
        return j.filter(x=>x.type==="dir" && !SKIP.test(x.name)).map(x=>x.name);
      }
    }catch(e){}
  }
  return FALLBACK;
}

async function load(){
  const names = await folders();
  const res = await Promise.all(names.map(async n=>{
    try{
      const r = await fetch(`${n}/index.html`);
      if(!r.ok) throw 0;
      return {slug:n, note:parseNote(await r.text()), ok:true};
    }catch(e){ return {slug:n, note:{}, ok:false}; }
  }));
  // Con l'API attiva, scarta le cartelle senza index.html
  items = res.filter(x=>x.ok || names===FALLBACK);
  items.sort((a,b)=>(a.note.nome||a.slug).localeCompare(b.note.nome||b.slug,"it"));
  render();
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && items.some(i=>i.slug===h)) open(h);
}

function render(){
  const list = $("list"); list.textContent = "";
  items.forEach(it=>{
    const b = document.createElement("button");
    b.dataset.slug = it.slug;
    const ic = document.createElement("span"); ic.className="ic"; ic.textContent = it.note.icona || "▫️";
    const t = document.createElement("span"); t.textContent = it.note.nome || nice(it.slug);
    b.append(ic,t);
    b.onclick = ()=>{ open(it.slug); if(innerWidth<=700) document.body.classList.add("closed"); };
    list.append(b);
  });
  $("count").textContent = items.length ? `${items.length} artefatti` : "Nessuna cartella trovata";
}

function open(slug){
  const it = items.find(i=>i.slug===slug); if(!it) return;
  current = it;
  $("frame").src = `${slug}/index.html`; $("frame").hidden = false; $("empty").hidden = true;
  $("title").textContent = it.note.nome || nice(slug);
  $("infoBtn").disabled = false; closeInfo();
  document.querySelectorAll("#list button").forEach(b=>b.setAttribute("aria-current", b.dataset.slug===slug));
  history.replaceState(null,"","#"+encodeURIComponent(slug));
}

function fillInfo(){
  const n = current.note, box = $("info"); box.textContent = "";
  const h = document.createElement("h2"); h.textContent = n.nome || nice(current.slug); box.append(h);
  const sec = (label, node)=>{ const t=document.createElement("h3"); t.textContent=label; box.append(t,node); };
  const p = (txt)=>{ const e=document.createElement("p"); e.textContent=txt; return e; };
  if(!Object.keys(n).length){
    box.append(p("Nessuna nota informativa trovata. Aggiungi nel file index.html della cartella \u201C"+current.slug+"\u201D il commento <!-- ARTEFATTO … -->."));
    return;
  }
  if(n.scopo) sec("Scopo", p(n.scopo));
  if(n.funzioni){
    const ul = document.createElement("ul");
    n.funzioni.split("\n").map(s=>s.replace(/^[-•*]\s*/,"").trim()).filter(Boolean)
      .forEach(s=>{const li=document.createElement("li"); li.textContent=s; ul.append(li);});
    sec("Funzioni", ul);
  }
  if(n["ultima modifica"]){ const e=p(n["ultima modifica"]); e.className="mod"; sec("Ultima modifica", e); }
}

function closeInfo(){ $("info").classList.remove("open"); $("infoBtn").setAttribute("aria-expanded","false"); }
$("infoBtn").onclick = ()=>{
  const o = $("info").classList.contains("open");
  if(o) return closeInfo();
  fillInfo(); $("info").classList.add("open"); $("infoBtn").setAttribute("aria-expanded","true");
};
$("toggle").onclick = ()=>document.body.classList.toggle("closed");
if(innerWidth<=700) document.body.classList.add("closed");
addEventListener("keydown",e=>{ if(e.key==="Escape") closeInfo(); });
load();
</script>
</body>
</html>
