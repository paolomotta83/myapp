<style>

.c.o{opacity:.4}.c.t{border-color:var(--ac)}.c.s{background:var(--ac);color:#fff}

.wr.t{border-color:var(--ac)}.wr.s{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--sf))}

.it small{color:var(--mu)}
.it .x{background:none;border:0;color:var(--mu);font-size:18px}

.add{display:flex;gap:6px;margin-top:10px}
.add input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;min-width:0}
.add input[type=text]{flex:1}.add button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:0 14px;font:inherit}
.sh{display:flex;gap:6px;margin-top:8px}.sh button{flex:1;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:8px 0;font:inherit;font-weight:600}.sh .on{background:var(--ac);color:#fff;border-color:var(--ac)}.sl{font-size:11px;font-weight:700;color:var(--ac);line-height:1.2}.c.s .sl{color:#fff}.c .sl{font-size:9.5px;white-space:nowrap}.c.r{background:color-mix(in srgb,var(--rd) 22%,var(--sf));color:var(--rd);font-weight:700}.c.r .sl{color:var(--rd)}.c.r.s{background:var(--rd);color:#fff}.c.r.s .sl{color:#fff}.c.r.s .dot{background:#fff}.wr.r{background:color-mix(in srgb,var(--rd) 18%,var(--sf))}.wr.r .sl{color:var(--rd)}
.tl{height:432px;overflow-y:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px}.tg{position:relative}.hr{position:absolute;left:0;right:0;height:48px;border-top:1px solid var(--ln)}.hr span{position:absolute;left:6px;top:2px;font-size:11px;color:var(--mu)}.ev{position:absolute;background:color-mix(in srgb,var(--ac) 25%,var(--sf));border-left:3px solid var(--ac);border-radius:6px;padding:2px 6px;font-size:12px;line-height:1.25;overflow:hidden}.ev small{display:block;color:var(--mu);font-size:10px}.ev.d{opacity:.5}.ad{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:14px}
.c.r{background:color-mix(in srgb,var(--rd) 22%,var(--sf));color:var(--rd);font-weight:700}.c.r.s{background:var(--rd);color:#fff}.c.r .sl{color:var(--rd)}.c.r.s .sl{color:#fff}.c.r.s .dot{background:#fff}.wr.r{background:var(--sf)}.wr.r.s{background:color-mix(in srgb,var(--ac) 14%,var(--sf))}.wr.r .n b{color:var(--rd)}.wr.r .sl{color:var(--ac)}
.ev{z-index:1}.ev.rp{left:52px;right:4px;border:2px solid var(--rd);background:color-mix(in srgb,var(--rd) 40%,transparent);z-index:2}
.add input[type=time]{width:92px;padding:8px 4px}.ex{margin-top:8px}
.it input[type=time]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 4px;width:88px}.it .sv{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit}.ev{cursor:pointer}.ev.rp{pointer-events:none}.pe{pointer-events:auto;position:absolute;right:0;top:0;padding:2px 6px;font-size:13px;cursor:pointer}
#pn{padding-bottom:12px}#sb{position:sticky;bottom:0;z-index:5;margin-top:auto;background:var(--bg);border-top:1px solid var(--ln)}#sm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 4px;font-size:12px;color:var(--mu);cursor:pointer}#sm span:nth-child(2){text-align:center}#sm span:nth-child(3){text-align:right}#calc{max-height:45vh;overflow-y:auto;padding:4px 4px 12px;border-top:1px solid var(--ln)}.cr{display:flex;justify-content:space-between;font-size:14px;padding-top:6px}.cr b{font-weight:600}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.ph h2{margin:0}.pb{display:flex;gap:8px}.pb button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx)}.cs{font-size:12px;color:var(--mu)}.ch{font-size:11px;font-weight:600;color:var(--mu);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}.wb{display:flex;gap:6px;align-items:flex-end;height:68px}.wc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;color:var(--mu)}.wc i{display:block;width:60%;min-height:2px;background:var(--rd);border-radius:3px 3px 0 0}#sm b{color:var(--tx);font-weight:600}.ex input[type=range]{width:100%;margin:0}.el{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}#ei{display:flex;gap:6px;margin-top:6px}#ei input{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}
.top{display:flex;align-items:center;gap:10px;margin:12px 0 8px}.top h1{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mb{flex:none;width:40px;height:40px;padding:0;background:var(--sf);border:1px solid var(--ln);border-radius:8px;color:var(--tx);font-size:20px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}#dwp{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);background:var(--bg);border-right:1px solid var(--ln);z-index:31;transform:translateX(-100%);transition:transform .2s;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px;overflow-y:auto}body.dw #dwp{transform:none}body.dw #ov{display:block}
.dt{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}.dt:first-child{margin-top:0}#scs,#rn{width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px}.rn{display:flex;gap:6px}.an{font-size:18px;font-weight:700;margin-bottom:14px}.stb{width:100%;margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:10px 12px;font:inherit;text-align:left}
.sr{display:flex;gap:6px}.sr select{flex:1;min-width:0}.tr{flex:none;width:44px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:0;font:inherit;font-size:12px;display:flex;align-items:center;justify-content:center}.tr.cf{width:auto;padding:0 10px;background:var(--rd);border-color:var(--rd);color:#fff}
.rn button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:0 14px;font:inherit}
</style>
</head>
<body>
<div class="top"><button id="mb" onclick="dw(1)" aria-label="Schede">&#9776;</button><h1 id="nm">Turni</h1></div>
<div id="ov" onclick="dw(0)"></div>
<aside id="dwp"><div class="an">Turni reparto</div><div class="dt">Scheda</div><div class="sr"><select id="scs" onchange="sw(this.value)"></select><button id="tr" class="tr" onclick="dlt()" aria-label="Elimina scheda"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
<div class="dt">Rinomina scheda</div><div class="rn"><input id="rn" type="text"><button onclick="ren()">OK</button></div>
<div class="dt">File di tutte le schede</div><div class="pb"><button aria-label="Carica" onclick="$('fa').click()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button><button aria-label="Scarica" onclick="expAll()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg></button></div>
<button class="stb" id="stat" aria-label="Analisi statistica"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M11 20V6M17 20v-9M3 20h18"/></svg>Analisi statistica</button>
<div class="em" id="dm"></div><input type="file" id="fa" hidden onchange="if(this.files[0])impAll(this.files[0]);this.value=''"></aside>
<div class="seg" id="seg"></div>
<div class="nav"><button id="pv">‹</button><b id="ti"></b><button id="nx">›</button></div>
<div id="cal"></div>
<div id="pn"></div><input type="file" id="fi" hidden onchange="if(this.files[0])imp(this.files[0]);this.value=''">
<div id="sb"><div id="sm" onclick="tc()"></div><div id="calc" hidden><div id="cc"></div></div></div>
<script>
const V=['giorno','settimana','mese','anno'],MS=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],DS=['lun','mar','mer','gio','ven','sab','dom'];
let view='mese',cur=new Date(),sel=new Date(),tasks={},shifts={};
cur.setHours(12);sel.setHours(12);
Object.keys(shifts).forEach(k=>{const v=shifts[k];if(typeof v==='string')shifts[k]=['Nr','Gr'].includes(v)?{b:v}:{a:v}});const lab=k=>{const s=shifts[k]||{};return [s.a,s.b].filter(Boolean).join(' ')};
Object.keys(shifts).forEach(k=>{if(shifts[k].a==='F/A'&&!(tasks[k]||[]).some(x=>x.s==='a'))(tasks[k]=tasks[k]||[]).unshift({t:'Ferie/Articolo',h:'',e:'',n:0,f:0,s:'a',d:432})});
const save=()=>stP(sch[act].id,tasks,shifts);
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=(y,m,d)=>new Date(y,m,d,12);
const same=(a,b)=>K(a)===K(b);
const open=k=>(tasks[k]||[]).some(x=>!x.f&&!x.s);
const off=d=>(d.getDay()+6)%7;
const $=id=>document.getElementById(id);
function go(n){ed=null;msg='';
 if(view==='giorno'){cur=D(cur.getFullYear(),cur.getMonth(),cur.getDate()+n);sel=cur}
 else if(view==='settimana')cur=D(cur.getFullYear(),cur.getMonth(),cur.getDate()+7*n);
 else if(view==='mese')cur=D(cur.getFullYear(),cur.getMonth()+n,1);
 else cur=D(cur.getFullYear()+n,cur.getMonth(),1);
 render();
}
function pick(k){ed=null;msg='';const[a,b,c]=k.split('-').map(Number);sel=D(a,b-1,c);cur=view==='mese'?cur:sel;render()}
function render(){
 $('seg').innerHTML=V.map(v=>`<button class="${v===view?'on':''}" onclick="view='${v}';if(view==='giorno')cur=sel;render()">${v}</button>`).join('');
 const today=new Date();let h='',t='';
 if(view==='mese'){
  t=MS[cur.getMonth()]+' '+cur.getFullYear();
  const f=D(cur.getFullYear(),cur.getMonth(),1);h='<div class="grid">'+DS.map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<42;i++){const d=D(f.getFullYear(),f.getMonth(),1-off(f)+i),k=K(d);
   h+=`<button class="c${d.getMonth()!==cur.getMonth()?' o':''}${same(d,today)?' t':''}${same(d,sel)?' s':''}${(shifts[k]||{}).b?' r':''}" onclick="pick('${k}')">${d.getDate()}<span class="sl">${lab(k)||'&nbsp;'}</span>${open(k)?'<i class="dot"></i>':'<i class="nd"></i>'}</button>`}
  h+='</div>';
 }else if(view==='settimana'){
  const s=D(cur.getFullYear(),cur.getMonth(),cur.getDate()-off(cur)),e=D(s.getFullYear(),s.getMonth(),s.getDate()+6);
  t=s.getDate()+' '+MS[s.getMonth()].slice(0,3)+' – '+e.getDate()+' '+MS[e.getMonth()].slice(0,3);
  for(let i=0;i<7;i++){const d=D(s.getFullYear(),s.getMonth(),s.getDate()+i),k=K(d),l=tasks[k]||[];
   h+=`<button class="wr${same(d,today)?' t':''}${same(d,sel)?' s':''}${(shifts[k]||{}).b?' r':''}" onclick="pick('${k}')"><div class="n">${DS[i]}<b>${d.getDate()}</b></div><div class="p">${l.map(x=>x.t).join(', ')||'—'}</div><span class="sl" style="font-size:14px">${lab(k)}</span>${open(k)?'<i class="dot"></i>':''}</button>`}
 }else if(view==='giorno'){
  t=DS[off(cur)]+' '+cur.getDate()+' '+MS[cur.getMonth()];h=tline(K(cur),K(D(cur.getFullYear(),cur.getMonth(),cur.getDate()-1)));
 }else{
  t=cur.getFullYear();h='<div class="yg">';
  for(let m=0;m<12;m++){const f=D(cur.getFullYear(),m,1),n=D(cur.getFullYear(),m+1,0).getDate();
   h+=`<button class="ym" onclick="cur=D(${cur.getFullYear()},${m},1);view='mese';render()"><b>${MS[m]}</b><div class="mg">`+'<i></i>'.repeat(off(f))+Array.from({length:n},(_,i)=>`<i${open(K(D(cur.getFullYear(),m,i+1)))?' class="h"':''}>${i+1}</i>`).join('')+'</div></button>'}
  h+='</div>';
 }
 $('ti').textContent=t;$('cal').innerHTML=h;$('sm').innerHTML=sumHtml();$('cc').innerHTML=calcHtml();
 if(view==='giorno'){const e=$('tl');e.scrollTop=tlTop;e.onscroll=()=>{tlTop=e.scrollTop}}
 if(view==='anno'){$('pn').innerHTML='';return}
 const k=K(sel),l=tasks[k]||[];
 $('pn').innerHTML=`<div class="panel"><div class="ph"><h2>${DS[off(sel)]} ${sel.getDate()} ${MS[sel.getMonth()]}</h2><div class="pb"><button id="bu" aria-label="Carica" onclick="$('fi').click()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button><button id="bd" aria-label="Scarica" onclick="exp()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg></button></div></div>${msg?`<div class="em">${esc(msg)}</div>`:''}`+
  (l.length?l.map((x,i)=>i===ed?`<div class="it"><span>${esc(x.t)}</span><input type="time" id="eh" value="${x.h||''}"><input type="time" id="ef" value="${x.e||''}"><button class="sv" onclick="saveEd()">✓</button><button class="x" onclick="ed=null;render()">✕</button></div>`:`<div class="it${x.f?' d':''}">${x.s?'':`<input type="checkbox" ${x.f?'checked':''} onchange="tog(${i})">`}<span onclick="edt(${i})" style="cursor:pointer">${esc(x.t)} ${x.h?`<small>${x.h}${x.e?'–'+x.e+(x.n?' (giorno dopo)':''):''}</small>`:''}${x.d?`<small>${Math.floor(x.d/60)}h${x.d%60?String(x.d%60).padStart(2,'0'):''}</small>`:''}</span><button class="x" onclick="del(${i})">×</button></div>`).join(''):'<div class="em">Nessuna attività</div>')+
  `<div class="add"><input type="text" id="nt" placeholder="Nuova attività" value="${esc(dr.t).replace(/"/g,'&quot;')}" oninput="dr.t=this.value"><input type="time" id="nh" value="${dr.h}" oninput="dr.h=this.value"><input type="time" id="nf" value="${dr.f}" oninput="dr.f=this.value"><button onclick="add()">+</button></div><div class="sh">${['M','P','R','F/A'].map(s=>`<button class="${(shifts[k]||{}).a===s?'on':''}" onclick="setSh('a','${s}')">${s}</button>`).join('')}</div><div class="sh">${['Gr','Nr','GNR'].map(s=>`<button class="${(shifts[k]||{}).b===s?'on':''}" onclick="setSh('b','${s}')">${s}</button>`).join('')}</div></div>`;
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function add(){const t=dr.t.trim();if(!t)return;const k=K(sel),x={t,h:dr.h,f:0};
 if(dr.h&&dr.f){x.e=dr.f;x.n=dr.f<=dr.h?1:0}
 (tasks[k]=tasks[k]||[]).push(x);dr={t:'',h:'',f:''};save();render()}
function tog(i){const l=tasks[K(sel)];l[i].f=l[i].f?0:1;save();render()}
function del(i){ed=null;const k=K(sel),x=tasks[k][i];tasks[k].splice(i,1);if(!tasks[k].length)delete tasks[k];if(x.s&&shifts[k]){delete shifts[k][x.s];if(!shifts[k].a&&!shifts[k].b)delete shifts[k]}save();render()}
let dr={t:'',h:'',f:''},ed=null;
function edt(i){ed=i;render();const p=$('pn');if(p)p.scrollIntoView({behavior:'smooth',block:'nearest'})}
